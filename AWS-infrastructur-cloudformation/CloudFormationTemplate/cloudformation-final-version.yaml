AWSTemplateFormatVersion: 2010-09-09
Description: Sorted Network and Compute Stack

Parameters:
  LabVpcCidr:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnet1Cidr:
    Type: String
    Default: 10.0.1.0/24
  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.2.0/24
  PrivateSubnet1Cidr:
    Type: String
    Default: 10.0.11.0/24
  PrivateSubnet2Cidr:
    Type: String
    Default: 10.0.12.0/24
  AmazonLinuxAMIID:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  PublicKeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 KeyPair to enable SSH access to the instance
    Default: vockey
  
  MyIpAdress:
    Type: String
    Default: 92.208.111.225/32
  
  DBName:
    Type: String
    Default: wordpress

  DBUser:
    Type: String
    Default: wpuser

  DBPassword:
    Type: String
    NoEcho: true
    Default: secret
    Description: WordPress database password
  
  DBUserPassword:
    Type: String
    NoEcho: true
    Default: secret
    Description: WordPressUser database password

Resources:

  #########################################
  # 1. VPC & GATEWAY (The Foundation)
  #########################################
  LabVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref LabVpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: Lab VPC

  IGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: Lab IGW

  VPCtoIGWConnection:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref IGW
      VpcId: !Ref LabVPC


  #########################################
  # 2. SUBNETS (The Segmentation)
  #########################################
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LabVPC
      MapPublicIpOnLaunch: true
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [ 0, !GetAZs "" ]
      Tags:
        - Key: Name
          Value: Public Subnet 1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LabVPC
      MapPublicIpOnLaunch: true
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [ 1, !GetAZs "" ]
      Tags:
        - Key: Name
          Value: Public Subnet 2

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LabVPC
      MapPublicIpOnLaunch: false
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [ 0, !GetAZs "" ]
      Tags:
        - Key: Name
          Value: Private Subnet 1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LabVPC
      MapPublicIpOnLaunch: false
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [ 1, !GetAZs "" ]
      Tags:
        - Key: Name
          Value: Private Subnet 2


  #########################################
  # 3. ROUTING (The Traffic Rules)
  #########################################
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref LabVPC
      Tags:
        - Key: Name
          Value: Public Route Table

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCtoIGWConnection
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IGW
      RouteTableId: !Ref PublicRouteTable

  PublicRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref LabVPC
      Tags:
        - Key: Name
          Value: Private Route Table

  PrivateRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet1

  PrivateRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet2


  #########################################
  # 4. EC2 & SECURITY (The Compute)
  #########################################
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: WebServerSG
      GroupDescription: Enable access to App
      VpcId: !Ref LabVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIpAdress
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup

      Tags:
        - Key: Name
          Value: WebServerSG

  #########################################
  # 5. LoadBalancer
  #########################################

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB Security Group
      VpcId: !Ref LabVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      
  Ec2TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 80
      Protocol: HTTP
      VpcId: !Ref LabVPC
      HealthCheckPath: /
      TargetType: instance

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref Ec2TargetGroup


  #########################################
  # 6. AutoScaling
  #########################################

  AmiEc2LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AmazonLinuxAMIID
        InstanceType: t3.micro
        KeyName: !Ref PublicKeyName

        SecurityGroupIds:
          - !Ref AppSecurityGroup

        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            exec > /var/log/wordpress-install.log 2>&1

            # ── 1. System update ──────────────────────────────────────────────
            dnf update -y

            # ── 2. Install Apache, PHP, MariaDB ──────────────────────────────
            dnf install -y httpd wget
            dnf install -y php php-mysqlnd php-fpm php-json php-mbstring php-xml php-gd php-curl
            dnf install -y mariadb105-server

            # ── 3. Start & enable services ────────────────────────────────────
            systemctl enable --now httpd
            systemctl enable --now mariadb

            # ── 4. Secure MariaDB & create WP database ────────────────────────
            # AL2023 MariaDB uses unix_socket auth — run as root OS user (we are root in UserData)
            # Set root password
            mysqladmin -u root password '${DBPassword}'

            # Create DB, user, and grant privileges using -e (no heredoc, avoids !Sub quoting issues)
            mysql -uroot -p'${DBPassword}' -e "CREATE DATABASE IF NOT EXISTS \`${DBName}\`;"
            mysql -uroot -p'${DBPassword}' -e "CREATE USER IF NOT EXISTS '${DBUser}'@'localhost' IDENTIFIED BY '${DBUserPassword}';"
            mysql -uroot -p'${DBPassword}' -e "GRANT ALL PRIVILEGES ON \`${DBName}\`.* TO '${DBUser}'@'localhost';"
            mysql -uroot -p'${DBPassword}' -e "FLUSH PRIVILEGES;"

            # ── 5. Download & configure WordPress ────────────────────────────
            cd /tmp
            wget -q https://wordpress.org/latest.tar.gz
            tar -xzf latest.tar.gz
            cp -r wordpress/* /var/www/html/
            rm -rf wordpress latest.tar.gz

            cd /var/www/html
            cp wp-config-sample.php wp-config.php
            sed -i "s/database_name_here/${DBName}/"  wp-config.php
            sed -i "s/username_here/${DBUser}/"        wp-config.php
            sed -i "s/password_here/${DBUserPassword}/"    wp-config.php

            # ── 6. Apache config ──────────────────────────────────────────────
            cat > /etc/httpd/conf.d/wordpress.conf <<'APACHECONF'
            <VirtualHost *:80>
                DocumentRoot /var/www/html
                <Directory /var/www/html>
                    AllowOverride All
                    Require all granted
                </Directory>
            </VirtualHost>
            APACHECONF

            # ── 7. Permissions ────────────────────────────────────────────────
            chown -R apache:apache /var/www/html
            chmod -R 755 /var/www/html
            mkdir -p /var/www/html/wp-content/uploads
            chown apache:apache /var/www/html/wp-content/uploads

            systemctl restart httpd

  Ec2InstanceAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MinSize: 2
      DesiredCapacity: 2
      MaxSize: 4

      VPCZoneIdentifier:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

      LaunchTemplate:
        LaunchTemplateId: !Ref AmiEc2LaunchTemplate
        Version: !GetAtt AmiEc2LaunchTemplate.LatestVersionNumber

      TargetGroupARNs:
        - !Ref Ec2TargetGroup

      HealthCheckType: ELB
      HealthCheckGracePeriod: 300

  ScaleOutPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref Ec2InstanceAutoScalingGroup
      AdjustmentType: ChangeInCapacity
      ScalingAdjustment: 1

  ScaleInPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref Ec2InstanceAutoScalingGroup
      AdjustmentType: ChangeInCapacity
      ScalingAdjustment: -1

  #########################################
  # 6a. Alarm for AutoScaling
  #########################################


  CPUHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 70
      ComparisonOperator: GreaterThanThreshold

      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref Ec2InstanceAutoScalingGroup

      AlarmActions:
        - !Ref ScaleOutPolicy

  CPULowAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 30
      ComparisonOperator: LessThanThreshold

      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref Ec2InstanceAutoScalingGroup

      AlarmActions:
        - !Ref ScaleInPolicy